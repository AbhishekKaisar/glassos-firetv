name: Feature request
description: Suggest an improvement or a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The problem or the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like GlassOS to do?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Fire TV
        - Android TV
        - Google TV
        - All of them
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered (optional)
